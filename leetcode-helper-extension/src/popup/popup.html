<!DOCTYPE html>
<html>
<head>
    <title>LeetCode Helper</title>
    <link rel="stylesheet" href="./popup.css">
</head>
<body>
    <div class="header">
        <div class="tab-button active" data-tab="hint">Hint</div>
        <div class="tab-button" data-tab="notes">Notes</div>
    </div>
    
    <div class="container">
        <div id="hint-tab" class="tab-content active">
            <textarea id="message" readonly></textarea>
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="hint-input" placeholder="Ask for a hint...">
                <button id="HintButton">Send</button>
            </div>
        </div>
        
        <div id="notes-tab" class="tab-content">
            <textarea id="notes-input" placeholder="Write your notes here..."></textarea>
            <div class="chat-input-container">
                <button id="SaveNotesButton">Save Notes</button>
            </div>
        </div>
    </div>
    <script src="./popup.js"></script>
</body>
</html>
