<!DOCTYPE html>
<html>
<head>
    <title>LeetCode Helper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <div class="tab-button active" data-tab="hint">Hint</div>
        <div class="tab-button" data-tab="solution">Solution</div>
    </div>
    <div class="container">
        <div id="hint-tab" class="tab-content active">
            <textarea id="message" readonly></textarea>
            <button id="HintButton">Hint</button>
        </div>
        <div id="solution-tab" class="tab-content">
            <textarea id="solution-message" readonly></textarea>
            <button id="SolutionButton">Get Solution</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
